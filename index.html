<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MEASUREMENT LOCK</title>
<meta name="description" content="A quantum measurement puzzle lab. Learn basis, collapse and superposition by playing.">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">

  <header id="topbar">
    <div class="brand"><span class="brand-mark"></span>MEASUREMENT&nbsp;LOCK</div>
    <div id="level-title">LAB 01 &middot; FIRST LOCK</div>
    <div id="level-dots" class="dots"></div>
  </header>

  <main id="main">

    <section id="stage-wrap">
      <div id="stage-head">
        <span id="level-intro"></span>
        <span id="lab-stats" class="stats"></span>
      </div>

      <div id="stage">
        <canvas id="fx"></canvas>
        <div id="room"></div>
        <div id="toast" class="toast"></div>
        <div id="overlay" class="overlay"></div>
      </div>

      <div id="controlbar">
        <div class="measure-group">
          <span class="target-tag">—</span>
          <button id="btn-measure-z" class="btn btn-z">
            <span class="btn-key">Z</span>
            <span class="btn-label">MEASURE Z</span>
            <span class="btn-sub"></span>
          </button>
          <button id="btn-measure-x" class="btn btn-x">
            <span class="btn-key">X</span>
            <span class="btn-label">MEASURE X</span>
            <span class="btn-sub"></span>
          </button>
        </div>
        <div class="nav-group">
          <button id="btn-prev" class="btn btn-ghost">PREV LAB</button>
          <button id="btn-reset" class="btn btn-ghost">RESET LEVEL</button>
          <button id="btn-next" class="btn btn-accent" disabled>NEXT LEVEL</button>
        </div>
      </div>

      <div id="keyhint">
        keys &nbsp;<b>z</b> measure Z &nbsp; <b>x</b> measure X &nbsp; <b>1-9</b> pick node &nbsp;
        <b>h</b> H gate &nbsp; <b>g</b> phase &nbsp; <b>u</b> re-init &nbsp; <b>r</b> reset &nbsp; <b>n</b> next
      </div>
    </section>

    <aside id="panel">
      <section class="card">
        <h2>LOCK CONDITIONS <span id="objectives-count" class="head-tag"></span></h2>
        <ol id="objective-list" class="objectives"></ol>
      </section>

      <section class="card">
        <h2>QUBIT READOUT</h2>
        <div id="readout" class="readout"></div>
      </section>

      <section class="card card-grow">
        <h2>MEASUREMENT HISTORY</h2>
        <div class="history-wrap">
          <ol id="history" class="history"></ol>
        </div>
      </section>
    </aside>

  </main>
</div>

<script src="quantum/qubit.js"></script>
<script src="quantum/register.js"></script>
<script src="game/gameState.js"></script>
<script src="game/levels.js"></script>
<script src="game/puzzle.js"></script>
<script src="ui/bloch.js"></script>
<script src="ui/renderer.js"></script>
<script src="ui/controls.js"></script>
<script src="main.js"></script>
</body>
</html>
